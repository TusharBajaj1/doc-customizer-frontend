# Fly.io config. Change `app` to a unique name, then run `fly launch --no-deploy --copy-config` and `fly deploy` from this folder.
app = "pdfrookie-converter"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # File types the converter accepts. Word-type by default; add spreadsheets/slides later, e.g.
  # CONVERT_EXTENSIONS = ".doc,.docx,.odt,.rtf,.txt,.xls,.xlsx,.ods,.csv,.ppt,.pptx,.odp"
  CONVERT_EXTENSIONS = ".doc,.docx,.odt,.rtf,.txt"
  # Comma-separated list of sites allowed to call this service.
  ALLOWED_ORIGINS = "https://pdfrookie.org,https://www.pdfrookie.org,https://localapp.pdfrookie.org"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # shut down when idle, so you only pay while it is converting
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 4

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"   # LibreOffice needs headroom for large files
